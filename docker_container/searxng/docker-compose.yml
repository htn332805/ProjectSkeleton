services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng_test
    restart: "no"
    ports:
      - "8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./tests/limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      TZ: "UTC"
      SEARXNG_BASE_URL: "http://localhost:8080/"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - searxng_net

  test-runner:
    image: python:3.11-slim
    depends_on:
      - searxng
    volumes:
      - ./tests:/workspace/tests:rw
      - ./host_artifacts:/workspace/tests/artifacts:rw
      - ./scripts:/scripts:ro
      - ./settings.yml:/workspace/settings.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SEARX_URL: http://searxng:8080
      TZ: UTC
      TEST_ROOT: /workspace/tests
    entrypoint: ["/bin/bash", "-lc", "bash /scripts/wait-for-service.sh searxng 8080 300 && bash /scripts/run_tests.sh"]
    tty: true
    stdin_open: true
    restart: "no"
    networks:
      - searxng_net

networks:
  searxng_net:
    driver: bridge
